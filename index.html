<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Histoire de France, le grand jeu</title>
<meta name="description" content="Quiz, cartes, frises et vrai ou faux sur l'histoire de France.">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Histoire de France">
<style>
:root{--ink:#1f2340;--soft:#5b6180;--line:#e6e8f2;--blue:#2563eb;--green:#16a34a;--red:#e11d48;--amber:#f59e0b;--violet:#7c3aed;--era:#2563eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.45;background:linear-gradient(180deg,#ffeab9 0%,#ffd9ea 55%,#d2e9ff 100%) fixed}
#app{max-width:560px;margin:0 auto;padding:12px 14px calc(28px + env(safe-area-inset-bottom))}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 20px;color:#fff;background:linear-gradient(135deg,#2563eb 0%,#7c3aed 60%,#ec4899 100%);box-shadow:0 6px 0 rgba(31,35,64,.18)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero:before{width:150px;height:150px;right:-40px;top:-50px}
.hero:after{width:90px;height:90px;right:60px;bottom:-45px}
.hero .castle{font-size:46px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
.hero h1{font-size:26px;line-height:1.1;font-weight:900;margin-top:4px;position:relative}
.hero p{opacity:.92;margin-top:6px;position:relative;font-size:15px}
@keyframes bob{50%{transform:translateY(-6px) rotate(-4deg)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#fff;border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 3px 0 rgba(31,35,64,.1)}
.stat b{display:block;font-size:22px;font-weight:900}
.stat span{font-size:12px;color:var(--soft)}
h2.sec{font-size:15px;font-weight:900;margin:16px 2px 8px;color:var(--ink);text-transform:none}
h2.sec i{font-style:normal;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;margin-right:6px}
.grid{display:grid;gap:8px}
.modes{grid-template-columns:1fr 1fr}
.mode{border:3px solid transparent;border-radius:18px;padding:12px 10px;text-align:left;background:#fff;box-shadow:0 4px 0 rgba(31,35,64,.12);min-height:78px;transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(31,35,64,.12)}
.mode .ic{font-size:26px;display:block}
.mode b{display:block;font-size:15px}
.mode small{color:var(--soft);font-size:12px}
.mode.wide{grid-column:1/-1;display:flex;align-items:center;gap:12px;min-height:64px}
.mode.on{border-color:var(--blue);background:#eef4ff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:3px solid transparent;background:#fff;border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px;box-shadow:0 3px 0 rgba(31,35,64,.12)}
.chip.on{border-color:var(--c,var(--blue));background:#fff;box-shadow:0 3px 0 var(--c,var(--blue));color:var(--ink)}
.chip.on:before{content:"✓ ";color:var(--c,var(--blue))}
.playbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));margin-top:18px;z-index:5}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:15px 18px;font-weight:900;font-size:17px;color:#fff;background:var(--blue);box-shadow:0 5px 0 #1d4ed8;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1d4ed8}
.btn.go{background:var(--green);box-shadow:0 5px 0 #15803d}
.btn.go:active{box-shadow:0 1px 0 #15803d}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(31,35,64,.15)}
.btn.small{padding:10px 14px;font-size:15px}
.hint{font-size:13px;color:var(--soft);text-align:center;margin-top:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
details.badges{background:#fff;border-radius:16px;padding:10px 14px;margin-top:16px;box-shadow:0 3px 0 rgba(31,35,64,.1)}
details.badges summary{font-weight:900;cursor:pointer}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.bd{border-radius:14px;padding:9px;background:#fff7d6;font-size:13px}
.bd b{display:block;font-size:14px}
.bd.lock{background:#eef0f6;filter:grayscale(1);opacity:.65}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.icon{width:42px;height:42px;border-radius:14px;border:0;background:#fff;font-weight:900;box-shadow:0 3px 0 rgba(31,35,64,.15);flex:none}
.bar{flex:1;height:14px;border-radius:99px;background:rgba(255,255,255,.75);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--era);transition:width .35s}
.pill{background:#fff;border-radius:99px;padding:7px 12px;font-weight:900;box-shadow:0 3px 0 rgba(31,35,64,.12);flex:none}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 2px 8px;font-size:13px}
.tag{color:#fff;font-weight:800;border-radius:99px;padding:4px 11px;font-size:12.5px}
.lvl{color:#d97706;letter-spacing:1px}
.streak{margin-left:auto;font-weight:900;color:#ea580c}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 5px 0 rgba(31,35,64,.14);border-top:8px solid var(--era)}
.qno{font-size:12px;color:var(--soft);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.card h2{font-size:19px;line-height:1.3;margin-bottom:14px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:56px;padding:10px 12px;border-radius:16px;border:3px solid var(--line);background:#fff;font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--line);transition:transform .08s}
.opt:active{transform:translateY(2px)}
.opt .l{flex:none;width:30px;height:30px;border-radius:10px;background:#eef0f8;display:grid;place-items:center;font-weight:900;font-size:14px}
.opt.ok{border-color:var(--green);background:#dcfce7;box-shadow:0 3px 0 var(--green)}
.opt.ok .l{background:var(--green);color:#fff}
.opt.ko{border-color:var(--red);background:#ffe4ea;box-shadow:0 3px 0 var(--red);animation:shake .3s}
.opt.ko .l{background:var(--red);color:#fff}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{justify-content:center;font-size:20px;font-weight:900;min-height:72px}
.vf .opt.v{--line:#bbf7d0}.vf .opt.f{--line:#fecdd3}
#map{width:100%;height:auto;display:block;border-radius:16px;background:#bfe3f7;touch-action:manipulation;border:3px solid #9fd0ee}
.land{fill:#c9f0b4;stroke:#58a83a;stroke-width:1.6;stroke-linejoin:round}
.rc{fill:#7a8aa6}.rt{font-size:11px;fill:#43506e;font-weight:700;paint-order:stroke;stroke:#e6f6ff;stroke-width:3px;stroke-linejoin:round}
.mapnote{font-size:13px;color:var(--soft);text-align:center;margin:8px 0 10px}
.fr{display:grid;gap:9px}
.fi{display:flex;align-items:center;gap:10px;text-align:left;width:100%;min-height:56px;padding:9px 12px;border-radius:16px;border:3px solid var(--line);background:#fff;font-weight:700;font-size:15.5px;box-shadow:0 3px 0 var(--line)}
.fi .num{flex:none;width:32px;height:32px;border-radius:50%;border:3px dashed #c4c9dc;display:grid;place-items:center;font-weight:900;color:#fff}
.fi.sel{border-color:var(--era);box-shadow:0 3px 0 var(--era);background:#faf5ff}
.fi.sel .num{border:0;background:var(--era)}
ol.res{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ol.res li{display:flex;gap:10px;align-items:center;border-radius:14px;padding:9px 11px;border:3px solid var(--line);font-weight:700;font-size:15px}
ol.res li.ok{border-color:var(--green);background:#dcfce7}
ol.res li.ko{border-color:var(--red);background:#ffe4ea}
ol.res li b{flex:none;min-width:84px;text-align:center;background:#fff;border-radius:10px;padding:3px 6px;font-size:13px}
.msg{font-size:13px;color:var(--red);font-weight:700;min-height:18px;margin-top:8px;text-align:center}
#fb{margin-top:14px}
.fb{border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 rgba(31,35,64,.14);animation:pop .25s ease-out}
.fb.ok{background:#dcfce7;border:3px solid var(--green)}
.fb.mid{background:#fef3c7;border:3px solid var(--amber)}
.fb.ko{background:#ffe4ea;border:3px solid var(--red)}
.fb .fh{font-size:20px;font-weight:900;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fb .pts{background:#fff;border-radius:99px;padding:2px 12px;font-size:16px}
.fb p{margin-bottom:6px;font-size:15.5px}
.fb p.lead{font-weight:800}
.fb .btn{margin-top:10px}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.end{text-align:center}
.big{font-size:64px;line-height:1}
.end h1{font-size:26px;margin:8px 0 2px;font-weight:900}
.score{font-size:46px;font-weight:900;color:var(--violet)}
.stars{font-size:38px;letter-spacing:4px;color:#f59e0b}
.stars .off{color:#d6d9e6}
.bk{background:#fff;border-radius:18px;padding:12px 14px;margin-top:14px;text-align:left;box-shadow:0 3px 0 rgba(31,35,64,.1)}
.bk h3{font-size:15px;margin-bottom:8px}
.br{display:grid;grid-template-columns:34px 1fr 40px;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.br .t{height:12px;border-radius:99px;background:#eceef7;overflow:hidden}
.br .t i{display:block;height:100%;border-radius:99px}
.nb{background:#fff7d6;border:3px solid var(--amber);border-radius:18px;padding:10px 14px;margin-top:14px;font-weight:800;animation:pop .4s}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti"></canvas>
<script src="questions.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var app=$("#app");
var STORE="histfr_v1";
var BADGES=[
 {id:"first",ico:"🎈",nom:"Premier pas",desc:"Termine une partie"},
 {id:"streak5",ico:"🔥",nom:"En feu",desc:"5 bonnes réponses d'affilée"},
 {id:"perfect",ico:"🏆",nom:"Sans faute",desc:"Réussis toute une partie"},
 {id:"explorer",ico:"🧭",nom:"Explorateur",desc:"Croise les 6 époques"},
 {id:"carto",ico:"🗺️",nom:"Cartographe",desc:"Place 5 lieux avec succès"},
 {id:"chrono",ico:"⏳",nom:"Maître du temps",desc:"Remets 5 frises dans l'ordre"}
];
var MODES=[
 {id:"mix",ic:"🎲",nom:"Mix surprise",sub:"Un peu de tout, c'est parti",wide:true},
 {id:"qcm",ic:"❓",nom:"Quiz QCM",sub:"4 réponses, 1 bonne"},
 {id:"map",ic:"🗺️",nom:"Carte à pointer",sub:"Touche le bon endroit"},
 {id:"frise",ic:"⏳",nom:"Frise du temps",sub:"Remets dans l'ordre"},
 {id:"vf",ic:"⚡",nom:"Vrai ou faux",sub:"Rapide et piégeux"}
];
var TYPEOF={qcm:"qcm",map:"map",frise:"frise",vf:"vf"};
var NQ=10;
var TOL={1:90,2:70,3:50};
var LABEL=["Tous niveaux","★ Facile","★★ Moyen","★★★ Difficile"];

function loadSave(){
 var d={best:0,played:0,badges:[],eras:[],mapOK:0,friseOK:0};
 try{var s=JSON.parse(localStorage.getItem(STORE)||"{}");for(var k in s)d[k]=s[k];}catch(e){}
 return d;
}
var save=loadSave();
function persist(){try{localStorage.setItem(STORE,JSON.stringify(save));}catch(e){}}

var sel={mode:"mix",era:0,lvl:0};
var G=null;
var deferredInstall=null;
var onHome=true;

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pick(arr,n,lvl){
 var pref=shuffle(arr.filter(function(q){return !lvl||q.lvl===lvl;}));
 var rest=shuffle(arr.filter(function(q){return lvl&&q.lvl!==lvl;}));
 return pref.concat(rest).slice(0,n);
}
function pool(){
 return QUESTIONS.filter(function(q){return (!sel.era||q.era===sel.era)&&(sel.mode==="mix"||q.t===TYPEOF[sel.mode]);});
}
function buildGame(){
 var p=pool(),list;
 if(sel.mode==="mix"){
  var want={qcm:4,vf:2,map:2,frise:2};
  list=[];
  Object.keys(want).forEach(function(t){
   list=list.concat(pick(p.filter(function(q){return q.t===t;}),want[t],sel.lvl));
  });
  if(list.length<NQ){
   var left=p.filter(function(q){return list.indexOf(q)<0;});
   list=list.concat(pick(left,NQ-list.length,sel.lvl));
  }
  list=shuffle(list);
 }else{
  list=shuffle(pick(p,NQ,sel.lvl));
 }
 return list;
}
function stars(n,max){var s="";for(var i=0;i<max;i++)s+=i<n?"★":"☆";return s;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* ---------- Accueil ---------- */
function home(){
 onHome=true;G=null;stopConfetti();
 var n=Math.min(NQ,pool().length);
 var iOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone;
 var standalone=window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches;
 var modes=MODES.map(function(m){
  return '<button class="mode'+(m.wide?' wide':'')+(sel.mode===m.id?' on':'')+'" data-act="mode" data-v="'+m.id+'"><span class="ic">'+m.ic+'</span><span><b>'+m.nom+'</b><small>'+m.sub+'</small></span></button>';
 }).join("");
 var eras='<button class="chip'+(sel.era===0?' on':'')+'" data-act="era" data-v="0">Toutes</button>'+ERAS.map(function(e){
  return '<button class="chip'+(sel.era===e.id?' on':'')+'" style="--c:'+e.c+'" data-act="era" data-v="'+e.id+'">'+e.e+' '+e.nom+'</button>';
 }).join("");
 var lv=LABEL.map(function(l,i){return '<button class="chip'+(sel.lvl===i?' on':'')+'" data-act="lvl" data-v="'+i+'">'+l+'</button>';}).join("");
 var bd=BADGES.map(function(b){
  var got=save.badges.indexOf(b.id)>=0;
  return '<div class="bd'+(got?'':' lock')+'"><b>'+b.ico+' '+b.nom+'</b>'+b.desc+'</div>';
 }).join("");
 var inst=deferredInstall?'<button class="btn ghost small" style="margin-top:14px" data-act="install">📲 Installer l\'appli sur cet appareil</button>':
  (iOS&&!standalone?'<p class="hint">Sur iPhone ou iPad : touche Partager, puis « Sur l\'écran d\'accueil » pour installer le jeu.</p>':'');
 app.innerHTML=
 '<div class="hero"><span class="castle" aria-hidden="true">🏰</span><h1>Histoire de France, le grand jeu</h1><p>Quiz, cartes, frises et vrai ou faux. De Vercingétorix à nos jours.</p></div>'+
 '<div class="stats"><div class="stat"><b>'+save.best+'</b><span>Meilleur score</span></div><div class="stat"><b>'+save.played+'</b><span>Parties jouées</span></div><div class="stat"><b>'+save.badges.length+'/'+BADGES.length+'</b><span>Badges</span></div></div>'+
 '<h2 class="sec"><i>1</i>Choisis ton jeu</h2><div class="grid modes">'+modes+'</div>'+
 '<h2 class="sec"><i>2</i>Choisis ton époque</h2><div class="chips">'+eras+'</div>'+
 '<h2 class="sec"><i>3</i>Choisis ton niveau</h2><div class="chips">'+lv+'</div>'+
 '<details class="badges"><summary>🏅 Mes badges</summary><div class="bgrid">'+bd+'</div></details>'+inst+
 '<div class="playbar"><button class="btn go" data-act="play">Jouer, '+n+' question'+(n>1?'s':'')+'</button></div>';
}

/* ---------- Partie ---------- */
function play(){
 var list=buildGame();
 if(!list.length){return;}
 stopConfetti();
 G={list:list,i:0,score:0,streak:0,maxStreak:0,correct:0,byEra:{},answered:false,cur:null,mapOK:0,friseOK:0};
 showQ();
}
function showQ(){
 onHome=false;
 var q=G.list[G.i],era=ERAS[q.era-1];
 G.answered=false;G.cur={};
 app.style.setProperty("--era",era.c);
 app.innerHTML=
 '<div class="top"><button class="icon" data-act="quit" aria-label="Quitter la partie">✕</button><div class="bar"><i style="width:'+(G.i/G.list.length*100)+'%"></i></div><div class="pill">⭐ <span id="sc">'+G.score+'</span></div></div>'+
 '<div class="meta"><span class="tag" style="background:'+era.c+'">'+era.e+' '+era.nom+'</span><span class="lvl" aria-label="Niveau '+q.lvl+' sur 3">'+stars(q.lvl,3)+'</span><span class="streak">'+(G.streak>=2?'🔥 '+G.streak+' d\'affilée':'')+'</span></div>'+
 '<div class="card"><div class="qno">Question '+(G.i+1)+' sur '+G.list.length+'</div><h2>'+esc(q.q)+'</h2><div id="zone"></div></div><div id="fb" aria-live="polite"></div>';
 window.scrollTo(0,0);
 if(q.t==="qcm")drawQcm(q);
 else if(q.t==="vf")drawVf();
 else if(q.t==="map")drawMap(q);
 else drawFrise(q,true);
}
function drawQcm(q){
 var order=shuffle([0,1,2,3]);G.cur.order=order;
 $("#zone").innerHTML='<div class="opts">'+order.map(function(k,p){
  return '<button class="opt" data-act="qcm" data-k="'+k+'"><span class="l">'+"ABCD"[p]+'</span><span>'+esc(q.o[k])+'</span></button>';
 }).join("")+'</div>';
}
function drawVf(){
 $("#zone").innerHTML='<div class="vf"><button class="opt v" data-act="vf" data-v="1">✅ Vrai</button><button class="opt f" data-act="vf" data-v="0">❌ Faux</button></div>';
}

/* ---------- Résolution commune ---------- */
var OKS=["Bravo !","Excellent !","Bien joué !","Exact !","Yes !"],KOS=["Raté !","Aïe !","Pas cette fois.","Dommage !"],MIDS=["Presque !","Pas mal !"];
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function resolve(ok,base,lead){
 var q=G.list[G.i];
 G.answered=true;
 var bonus=0;
 if(ok){G.streak++;G.maxStreak=Math.max(G.maxStreak,G.streak);G.correct++;if(G.streak>=3)bonus=5;}
 else G.streak=0;
 var pts=base+bonus;
 G.score+=pts;
 var b=G.byEra[q.era]||(G.byEra[q.era]={ok:0,n:0});b.n++;if(ok)b.ok++;
 var sc=$("#sc");if(sc)sc.textContent=G.score;
 var last=G.i+1>=G.list.length;
 var cls=ok?"ok":(base>0?"mid":"ko");
 var head=ok?rnd(OKS):(base>0?rnd(MIDS):rnd(KOS));
 $("#fb").innerHTML='<div class="fb '+cls+'"><div class="fh"><span>'+head+'</span><span class="pts">+'+pts+(bonus?' 🔥':'')+'</span></div>'+(lead?'<p class="lead">'+lead+'</p>':'')+'<p>'+esc(q.e)+'</p>'+(bonus?'<p>Bonus de série : +5</p>':'')+'<button class="btn '+(ok?'go':'')+'" data-act="next">'+(last?'Voir mon résultat':'Question suivante')+'</button></div>';
 var fb=$("#fb");
 if(fb.scrollIntoView)fb.scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ---------- Carte ---------- */
var KX=27.5,KY=40,LON0=-5.5,LAT0=51.5;
function px(lon,lat){return [(lon-LON0)*KX,(LAT0-lat)*KY];}
function unpx(x,y){return [x/KX+LON0,LAT0-y/KY];}
function km(lat1,lon1,lat2,lon2){
 var R=6371,r=Math.PI/180,dl=(lat2-lat1)*r,dn=(lon2-lon1)*r;
 var a=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dn/2)*Math.sin(dn/2);
 return 2*R*Math.asin(Math.sqrt(a));
}
var FR_OUT=[[2.55,51.09],[1.95,50.95],[1.58,50.88],[1.60,50.45],[1.55,50.20],[1.40,50.05],[1.10,49.93],[0.65,49.80],[0.10,49.50],[-0.20,49.30],[-0.80,49.35],[-1.25,49.45],[-1.60,49.65],[-1.85,49.72],[-1.60,49.20],[-1.55,48.80],[-2.00,48.65],[-2.80,48.55],[-3.40,48.85],[-3.90,48.70],[-4.50,48.65],[-4.78,48.40],[-4.50,48.10],[-4.35,47.85],[-3.60,47.80],[-3.00,47.55],[-2.50,47.40],[-2.20,47.25],[-2.15,46.95],[-1.95,46.70],[-1.35,46.35],[-1.15,46.15],[-1.20,45.80],[-1.05,45.55],[-1.25,45.10],[-1.25,44.65],[-1.40,44.10],[-1.50,43.55],[-1.78,43.37],[-1.30,43.10],[-0.70,43.00],[0.15,42.80],[0.70,42.80],[1.45,42.45],[2.00,42.35],[3.10,42.43],[3.05,42.95],[3.45,43.30],[4.10,43.50],[4.60,43.40],[5.10,43.35],[5.35,43.30],[5.85,43.10],[6.35,43.12],[6.70,43.30],[7.10,43.62],[7.50,43.78],[7.35,44.10],[6.95,44.40],[6.75,44.90],[7.05,45.15],[6.80,45.50],[6.85,45.83],[6.80,46.20],[6.25,46.35],[6.10,46.25],[6.45,46.45],[6.95,47.00],[7.05,47.35],[7.55,47.58],[7.60,48.10],[7.80,48.60],[8.20,48.97],[7.55,49.05],[6.95,49.20],[6.37,49.46],[5.90,49.50],[5.75,49.55],[4.95,49.95],[4.85,50.15],[4.20,50.30],[3.60,50.40],[3.20,50.75],[2.65,50.80]];
var CORSE=[[9.40,43.00],[9.55,42.60],[9.50,42.10],[9.25,41.80],[9.20,41.40],[8.80,41.55],[8.60,41.90],[8.65,42.30],[8.90,42.55],[9.20,42.75]];
var REFS=[["Paris",2.35,48.86],["Lyon",4.84,45.76],["Marseille",5.37,43.30],["Bordeaux",-0.58,44.84],["Lille",3.06,50.63],["Strasbourg",7.75,48.58],["Toulouse",1.44,43.60],["Nantes",-1.55,47.22]];
function poly(pts){return pts.map(function(p){var c=px(p[0],p[1]);return c[0].toFixed(1)+","+c[1].toFixed(1);}).join(" ");}
function drawMap(q){
 var refs=REFS.filter(function(r){return km(r[2],r[1],q.lat,q.lon)>45;}).map(function(r){
  var c=px(r[1],r[2]);
  return '<circle class="rc" cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" r="3"/><text class="rt" x="'+(c[0]+6).toFixed(1)+'" y="'+(c[1]+4).toFixed(1)+'">'+r[0]+'</text>';
 }).join("");
 $("#zone").innerHTML=
 '<svg id="map" viewBox="0 0 432 420" role="img" aria-label="Carte de la France : touche pour placer ta réponse"><rect width="432" height="420" fill="#bfe3f7"/><polygon class="land" points="'+poly(FR_OUT)+'"/><polygon class="land" points="'+poly(CORSE)+'"/>'+refs+'<g id="mk"></g></svg>'+
 '<p class="mapnote" id="mnote">Touche la carte pour placer ton repère.</p>'+
 '<button class="btn" id="mval" data-act="mapval" style="display:none">Valider mon repère</button>';
 var svg=$("#map");
 svg.addEventListener("click",function(ev){
  if(G.answered)return;
  var pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;
  var m=svg.getScreenCTM();if(!m)return;
  var p=pt.matrixTransform(m.inverse());
  G.cur.x=p.x;G.cur.y=p.y;
  $("#mk").innerHTML='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="9" fill="#e11d48" stroke="#fff" stroke-width="3"/>';
  $("#mval").style.display="block";
  $("#mnote").textContent="Tu peux retoucher la carte pour déplacer ton repère.";
 });
}
function mapVal(){
 if(G.answered)return;
 var q=G.list[G.i];
 if(G.cur.x==null){$("#mnote").textContent="Place d'abord ton repère sur la carte.";return;}
 var ll=unpx(G.cur.x,G.cur.y);
 var d=Math.round(km(ll[1],ll[0],q.lat,q.lon));
 var tol=TOL[q.lvl];
 var ok=d<=tol,base=ok?10:(d<=tol*2?5:0);
 var t=px(q.lon,q.lat);
 var rr=tol/2.78;
 $("#mk").innerHTML=
  '<circle cx="'+t[0].toFixed(1)+'" cy="'+t[1].toFixed(1)+'" r="'+rr.toFixed(1)+'" fill="rgba(22,163,74,.18)" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>'+
  '<line x1="'+G.cur.x.toFixed(1)+'" y1="'+G.cur.y.toFixed(1)+'" x2="'+t[0].toFixed(1)+'" y2="'+t[1].toFixed(1)+'" stroke="#1f2340" stroke-width="2" stroke-dasharray="4 3"/>'+
  '<circle cx="'+G.cur.x.toFixed(1)+'" cy="'+G.cur.y.toFixed(1)+'" r="8" fill="#e11d48" stroke="#fff" stroke-width="3"/>'+
  '<polygon points="'+starPts(t[0],t[1],13,6)+'" fill="#facc15" stroke="#92400e" stroke-width="2"/>'+
  '<text class="rt" x="'+(t[0]+14).toFixed(1)+'" y="'+(t[1]-12).toFixed(1)+'" style="font-size:13px">'+esc(q.lieu)+'</text>';
 var mv=$("#mval");if(mv)mv.style.display="none";
 $("#mnote").textContent="Étoile jaune : la bonne réponse. Cercle vert : zone acceptée.";
 if(ok)G.mapOK++;
 resolve(ok,base,ok?("Dans le mille : "+d+" km d'écart."):("À "+d+" km. La réponse était : "+esc(q.lieu)+"."));
}
function starPts(cx,cy,R,r){var p=[];for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rad=i%2?r:R;p.push((cx+rad*Math.cos(a)).toFixed(1)+","+(cy+rad*Math.sin(a)).toFixed(1));}return p.join(" ");}

/* ---------- Frise ---------- */
function drawFrise(q,init){
 var c=G.cur;
 if(init){c.items=shuffle(q.items.map(function(_,i){return i;}));c.order=[];}
 $("#zone").innerHTML=
  '<div class="fr">'+c.items.map(function(i){
   var pos=c.order.indexOf(i);
   return '<button class="fi'+(pos>=0?' sel':'')+'" data-act="frpick" data-i="'+i+'"><span class="num">'+(pos>=0?pos+1:'')+'</span><span>'+esc(q.items[i].n)+'</span></button>';
  }).join("")+'</div><p class="msg" id="msg"></p>'+
  '<div class="row"><button class="btn ghost small" data-act="frclear">Effacer</button><button class="btn small" data-act="frval">Valider</button></div>'+
  '<p class="hint">Touche les événements dans l\'ordre, du plus ancien au plus récent. Retouche-en un pour l\'enlever.</p>';
}
function friseVal(){
 if(G.answered)return;
 var q=G.list[G.i],c=G.cur,n=q.items.length;
 if(c.order.length<n){$("#msg").textContent="Place les "+n+" événements avant de valider.";return;}
 var sorted=q.items.map(function(_,i){return i;}).sort(function(a,b){return q.items[a].y-q.items[b].y;});
 var good=0;c.order.forEach(function(idx,p){if(idx===sorted[p])good++;});
 var ok=good===n;
 if(ok)G.friseOK++;
 $("#zone").innerHTML='<ol class="res">'+sorted.map(function(idx,p){
  var right=c.order[p]===idx;
  return '<li class="'+(c.order.indexOf(idx)===p?'ok':'ko')+'"><b>'+esc(q.items[idx].l)+'</b><span>'+esc(q.items[idx].n)+'</span></li>';
 }).join("")+'</ol>';
 resolve(ok,Math.round(10*good/n),ok?"Chronologie parfaite !":(good+" événement"+(good>1?"s":"")+" sur "+n+" bien placé"+(good>1?"s":"")+". Voici le bon ordre."));
}

/* ---------- Fin de partie ---------- */
function end(){
 var len=G.list.length,pct=Math.round(G.correct/len*100);
 G.list.forEach(function(q){if(save.eras.indexOf(q.era)<0)save.eras.push(q.era);});
 save.played++;save.best=Math.max(save.best,G.score);
 save.mapOK+=G.mapOK;save.friseOK+=G.friseOK;
 var got=[];
 function give(id){if(save.badges.indexOf(id)<0){save.badges.push(id);got.push(id);}}
 give("first");
 if(G.maxStreak>=5)give("streak5");
 if(G.correct===len&&len>=3)give("perfect");
 if(save.eras.length>=6)give("explorer");
 if(save.mapOK>=5)give("carto");
 if(save.friseOK>=5)give("chrono");
 persist();
 var st=pct>=90?3:pct>=60?2:pct>=30?1:0;
 var title=pct>=90?"Légende de l'Histoire !":pct>=70?"Excellent niveau !":pct>=50?"Bon début, continue !":"Apprenti historien";
 var emo=pct>=90?"🏆":pct>=70?"🎉":pct>=50?"👍":"📚";
 var rows=Object.keys(G.byEra).sort().map(function(k){
  var e=ERAS[k-1],b=G.byEra[k];
  return '<div class="br"><span style="font-size:20px">'+e.e+'</span><div><div style="font-size:13px;font-weight:700">'+e.nom+'</div><div class="t"><i style="width:'+Math.round(b.ok/b.n*100)+'%;background:'+e.c+'"></i></div></div><b>'+b.ok+'/'+b.n+'</b></div>';
 }).join("");
 var nb=got.map(function(id){var b=BADGES.filter(function(x){return x.id===id;})[0];return '<div class="nb">'+b.ico+' Nouveau badge : '+b.nom+'</div>';}).join("");
 var weak=Object.keys(G.byEra).filter(function(k){return G.byEra[k].ok<G.byEra[k].n;}).sort(function(a,b){return (G.byEra[a].ok/G.byEra[a].n)-(G.byEra[b].ok/G.byEra[b].n);})[0];
 var tip=weak?'<p class="hint" style="font-size:14px">À revoir : '+ERAS[weak-1].e+' '+ERAS[weak-1].nom+'.</p>':'<p class="hint" style="font-size:14px">Aucune erreur, bravo !</p>';
 app.style.setProperty("--era","#7c3aed");
 app.innerHTML='<div class="end"><div class="big" aria-hidden="true">'+emo+'</div><h1>'+title+'</h1><p>'+G.correct+' bonne'+(G.correct>1?'s':'')+' réponse'+(G.correct>1?'s':'')+' sur '+len+'</p><div class="score">'+G.score+' pts</div><div class="stars" aria-label="'+st+' étoiles sur 3">'+[0,1,2].map(function(i){return '<span class="'+(i<st?'':'off')+'">★</span>';}).join("")+'</div>'+nb+'<div class="bk"><h3>Tes résultats par époque</h3>'+rows+'</div>'+tip+'<div class="row"><button class="btn ghost" data-act="home">Accueil</button><button class="btn go" data-act="play">Rejouer</button></div></div>';
 window.scrollTo(0,0);
 if(pct>=70||got.length)confetti();
}

/* ---------- Confettis ---------- */
function confetti(){
 if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 var cv=$("#confetti"),ctx=cv.getContext("2d");
 cv.width=innerWidth;cv.height=innerHeight;
 var cols=["#f59e0b","#2563eb","#ec4899","#16a34a","#7c3aed","#ef4444"],ps=[];
 for(var i=0;i<110;i++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,w:6+Math.random()*7,h:8+Math.random()*8,vy:2+Math.random()*3.5,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[i%cols.length]});
 var t0=performance.now(),my=++cfId;
 (function f(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(my!==cfId)return;
  ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});
  if(t-t0<3200)requestAnimationFrame(f);else ctx.clearRect(0,0,cv.width,cv.height);
 })(t0);
}
var cfId=0;
function stopConfetti(){cfId++;var cv=$("#confetti");cv.getContext("2d").clearRect(0,0,cv.width,cv.height);}

/* ---------- Actions ---------- */
var ACT={
 mode:function(d){sel.mode=d.v;home();},

  if(G.answered)return;
  var q=G.list[G.i],k=parseInt(d.k,10),ok=k===0;
  document.querySelectorAll(".opt").forEach(function(b){
   var bk=parseInt(b.dataset.k,10);b.disabled=true;
   if(bk===0)b.classList.add("ok");else if(bk===k)b.classList.add("ko");else b.classList.add("dim");
  });
  resolve(ok,ok?10:0,ok?"":"La bonne réponse : "+esc(q.o[0])+".");
 },

   var isTrue=b.dataset.v==="1";b.disabled=true;

  resolve(ok,ok?10:0,ok?"":"C'était "+(q.a?"vrai":"faux")+".");
 },

  if(G.answered)return;

 },

document.addEventListener("click",function(e){

if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){

}
home();
})();
